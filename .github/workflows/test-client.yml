name: Headless client contracts

on: [push, pull_request]

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            worker: build-e2e/sapphire_test_client
          - os: windows-2025
            worker: build-e2e/Debug/sapphire_test_client.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build asset-independent client
        run: |
          cmake -S src/test_client -B build-e2e -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-e2e --config Debug
      - name: Wire and controller tests (not live gameplay coverage)
        run: |
          python -m pip install -r tests/e2e/requirements.txt
          ctest --test-dir build-e2e -C Debug --output-on-failure
          python -m pytest tests/e2e/test_worker.py tests/e2e/test_policy.py tests/e2e/test_ci.py tests/e2e/test_soak.py tests/e2e/test_client_smoke.py tests/e2e/test_workload_cleanup.py tests/e2e/test_combat_policy.py tests/e2e/test_inventory_policy.py tests/e2e/test_minimize.py --e2e-worker ${{ matrix.worker }} --junitxml=build-e2e/contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-contracts-${{ matrix.os }}
          path: |
            build-e2e/contracts.xml
            build-e2e/Testing/Temporary/LastTest.log
