name: Headless client contracts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            worker: build-e2e/sapphire_test_client
          - os: windows-2025
            worker: build-e2e/Debug/sapphire_test_client.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        timeout-minutes: 5
        with:
          python-version: '3.11'
      - name: Build asset-independent client
        timeout-minutes: 10
        run: |
          cmake -S src/test_client -B build-e2e -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-e2e --config Debug
      - name: Wire and controller tests (not live gameplay coverage)
        timeout-minutes: 12
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tests/e2e/requirements.txt
          ctest --test-dir build-e2e -C Debug --output-on-failure --timeout 60 --no-tests=error
          python -m pytest tests/e2e/test_worker.py tests/e2e/test_policy.py tests/e2e/test_ci.py tests/e2e/test_soak.py tests/e2e/test_client_smoke.py tests/e2e/test_workload_cleanup.py tests/e2e/test_combat_policy.py tests/e2e/test_inventory_policy.py tests/e2e/test_minimize.py tests/e2e/test_workflow_policy.py --e2e-worker ${{ matrix.worker }} --junitxml=build-e2e/contracts.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        timeout-minutes: 5
        with:
          name: client-contracts-${{ matrix.os }}
          path: |
            build-e2e/contracts.xml
            build-e2e/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
